[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcore-plugin"
version = "0.1.0"
description = "Plugin SDK for StreamCoreAI — build Python plugins for the voice agent server"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["streamcoreai_plugin*"]
